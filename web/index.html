<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HorizonBoat · 防 OOC 设定库与发散引擎</title>
    <meta
      name="description"
      content="HorizonBoat 收录作品的防 OOC 系统提示词、角色钢印卡与世界观发散钩子，以静态 JSON 直接作为 API，供人或 Agent 直接调用。"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e0a458' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='17' cy='6.6' r='1.8'/%3E%3Cpath d='M2.5 14.2h19'/%3E%3Cpath d='M11.4 14.2V5.9l4.4 8.3z'/%3E%3Cpath d='M7.4 17.4c1.5 1.1 3 1.1 4.3 0 1.2-1.1 2.8-1.1 4.3 0'/%3E%3C/svg%3E" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong surface.
      (function () {
        try {
          var stored = localStorage.getItem("hb-theme");
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
