name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  site:
    name: site · dataset validation · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Validate dataset
        working-directory: web
        run: npm run check:api
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build
      - name: Assert build output
        working-directory: web
        run: |
          test -f dist/index.html
          test -f dist/api/v1/index.json
          grep -q 'src="/assets/' dist/index.html

  mcp:
    name: mcp · python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -r mcp-server/requirements.txt
      - name: Byte-compile
        run: python -m compileall -q mcp-server/server.py mcp-server/smoke_test.py
      - name: Selftest against repository data
        env:
          HORIZENBOAT_API_URL: web/public/api/v1
          PYTHONIOENCODING: utf-8
        run: python mcp-server/server.py --selftest
      - name: Protocol smoke test
        env:
          HORIZENBOAT_API_URL: web/public/api/v1
          PYTHONIOENCODING: utf-8
        run: python mcp-server/smoke_test.py
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel --outdir /tmp/dist mcp-server
          ls -l /tmp/dist
