name: Deploy to GitHub Pages

# 生产站点部署在 Cloudflare Pages（见 scripts/publish.ps1），
# 这个工作流仅作为 GitHub Pages 备用方案，手动触发，避免每次 push 都红叉。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Validate dataset
        run: npm run check:api
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
