[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horizonboat-mcp"
version = "1.0.0"
description = "HorizonBoat 防 OOC 设定库的 MCP Server：锁定时间线、审查吃书、三阶发散。单文件，带本地缓存。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HorizonBoat" }]
keywords = ["mcp", "fanfic", "canon", "worldbuilding", "llm", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["mcp>=1.2.0,<2", "httpx>=0.27,<1"]

[project.urls]
Homepage = "https://horizonboat.online"
Repository = "https://github.com/horizonboat/horizonboat"
Source = "https://github.com/horizonboat/horizonboat/tree/main/mcp-server"

[project.scripts]
horizonboat-mcp = "horizonboat_mcp:main"

# 实现仍然只有 server.py 一个文件；hatch 把它映射进包目录，
# 这样 wheel 里不会出现一个叫 server 的顶层模块（那是真会撞名的）。
[tool.hatch.build.targets.wheel]
packages = ["horizonboat_mcp"]
force-include = { "server.py" = "horizonboat_mcp/server.py" }

[tool.hatch.build.targets.sdist]
include = ["server.py", "horizonboat_mcp", "README.md", "requirements.txt", "pyproject.toml"]

[tool.uv]
package = true
